metadata.format.version = "1.1"

[versions]

annotations = "26.1.0"
caffeine = "3.3.1"
evalex = "3.8.0"
gson = "2.15.0"
guava = "33.8.0-jre"
hocon = "1.4.10"
junit = "5.14.4"
snakeyaml = "2.7"
toml = "3.9.0"
types = "1.5.0"

[libraries]

annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
evalex = { module = "com.ezylang:EvalEx", version.ref = "evalex" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
hocon = { module = "com.typesafe:config", version.ref = "hocon" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
toml = { module = "com.electronwill.night-config:toml", version.ref = "toml" }
types-api = { module = "com.saicone:types-api", version.ref = "types" }
types-mapper = { module = "com.saicone:types-mapper", version.ref = "types" }
types-wrapper = { module = "com.saicone:types-wrapper", version.ref = "types" }
