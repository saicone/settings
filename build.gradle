allprojects {
    apply plugin: 'java'
    apply plugin: 'idea'

    idea {
        module {
            downloadJavadoc = true
            downloadSources = true
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly libs.annotations

        testImplementation(platform(libs.junit.bom))
        testImplementation(libs.junit.jupiter)
        testRuntimeOnly(libs.junit.platform.launcher)
        testImplementation(libs.guava)
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
        }
    }

    compileJava {
        options.encoding = 'UTF-8'
    }

    java {
        toolchain.languageVersion.set(JavaLanguageVersion.of(25))
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 11
    }

    javadoc {
        options {
            links 'https://docs.oracle.com/en/java/javase/11/docs/api/'
            links "https://javadoc.io/doc/org.jetbrains/annotations/${libs.versions.annotations.get()}/"
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    apply from: "$rootDir/gradle/publish-config.gradle"

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java
            }
        }
    }

    if (project.name != 'settings-api') {
        dependencies {
            api project(':settings-api')
        }

        publishing {
            publications {
                maven(MavenPublication) {
                    pom {
                        afterEvaluate {
                            description = "Module \"${project.name}\" of Settings"
                        }
                    }
                }
            }
        }
    }
}

def javadocProjects= [
        ':settings-api',
        ':settings-gson',
        ':settings-hocon',
        ':settings-toml',
        ':settings-yaml'
]

tasks.register('allJavadoc', Javadoc) {
    group = 'documentation'

    source javadocProjects.collect { project(it).sourceSets.main.allJava }
    classpath = files(javadocProjects.collect { project(it).sourceSets.main.compileClasspath })
    javadocTool.set(javaToolchains.javadocToolFor {
        languageVersion.set(JavaLanguageVersion.of(25))
    })

    options {
        def allLinks = javadocProjects.collect { projectPath ->
            project(projectPath).javadoc.options.links
        }.flatten().unique()
        allLinks.each { link -> links link }
    }

    destinationDir = file(project.layout.buildDirectory.dir('docs/all-javadoc'))
}
