description = 'Settings'

dependencies {
    api libs.types.api
    api libs.types.mapper
    api libs.types.wrapper

    compileOnly libs.evalex
    compileOnly libs.caffeine
    compileOnly libs.guava
}

javadoc {
    options {
        links "https://javadoc.io/doc/com.saicone/types-api/${libs.versions.types.get()}/"
        links "https://javadoc.io/doc/com.saicone/types-mapper/${libs.versions.types.get()}/"
        links "https://javadoc.io/doc/com.ezylang/EvalEx/${libs.versions.evalex.get()}/"
        links "https://javadoc.io/doc/com.github.ben-manes.caffeine/caffeine/${libs.versions.caffeine.get()}/"
        links "https://javadoc.io/doc/com.google.guava/guava/${libs.versions.guava.get()}/"
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            pom {
                afterEvaluate {
                    description = 'Java library to interpret multiple data formats as flexible configuration'
                }
            }
        }
    }
}