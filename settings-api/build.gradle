description = 'Settings'

dependencies {
    api libs.types.api
    api libs.types.mapper

    compileOnly libs.evalex
    compileOnly libs.caffeine
    compileOnly libs.guava
}

javadoc {
    options {
        links "https://javadoc.io/doc/com.ezylang/EvalEx/${libs.versions.evalex.get()}/"
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            pom {
                afterEvaluate {
                    description = 'Java library to interpret multiple data formats as flexible configuration'
                }
            }
        }
    }
}